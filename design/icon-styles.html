<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>MyTab · 磁贴图标样式方案</title>
<style>
/* ===== 与 styles.css 保持一致的设计变量 ===== */
:root {
  --fg: #1f2937;
  --fg-soft: rgba(31, 41, 55, .72);
  --card: rgba(255, 255, 255, .62);
  --card-border: rgba(255, 255, 255, .55);
  --tile-bg: rgba(255, 255, 255, .58);
  --tile-hover: rgba(255, 255, 255, .85);
  --accent: #4f46e5;
  --shadow: 0 10px 30px rgba(0, 0, 0, .12);
  --text-shadow: 0 1px 2px rgba(255, 255, 255, .35);
}
html[data-theme="dark"] {
  --fg: #f3f4f6;
  --fg-soft: rgba(243, 244, 246, .68);
  --card: rgba(17, 24, 39, .52);
  --card-border: rgba(255, 255, 255, .09);
  --tile-bg: rgba(31, 41, 55, .62);
  --tile-hover: rgba(55, 65, 81, .8);
  --accent: #818cf8;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  color: var(--fg);
  background: linear-gradient(160deg, #a18cd1 0%, #fbc2eb 100%);
  background-attachment: fixed;
  padding: 44px 46px 72px;
}
html[data-theme="dark"] body { background: linear-gradient(160deg, #0f0c29 0%, #302b63 45%, #24243e 100%); }

.page-head { margin-bottom: 34px; }
.page-head h1 { font-size: 27px; font-weight: 700; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.4); }
.page-head p { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.9); text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.theme-toggle {
  margin-top: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55);
  background: rgba(255,255,255,.35); color: #fff; font-family: inherit; font-size: 13px; cursor: pointer;
  backdrop-filter: blur(10px);
}
.theme-toggle:hover { background: rgba(255,255,255,.55); }

/* ===== 方案面板 ===== */
.panel { margin-bottom: 34px; }
.panel-head { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 14px; }
.badge {
  flex: none; width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #fff;
  background: linear-gradient(145deg, #6366f1, #a855f7);
  box-shadow: 0 6px 16px rgba(0,0,0,.25);
}
.panel-head h2 { font-size: 17px; font-weight: 700; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.35); }
.panel-head .desc { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.86); text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.panel-body { display: flex; align-items: center; gap: 34px; flex-wrap: wrap; }

/* ===== 磁贴（与 styles.css 一致） ===== */
.tiles { display: flex; gap: 16px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  width: 92px; padding: 14px 8px 10px; border-radius: 18px;
  text-decoration: none; color: var(--fg); position: relative;
  transition: transform .18s ease, background .18s ease;
}
.tile:hover { background: var(--tile-bg); transform: translateY(-4px); }
.tile-avatar {
  width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700; color: #fff;
  box-shadow: 0 6px 16px rgba(0,0,0,.18);
  user-select: none; overflow: hidden;
}
.tile-avatar .tile-img {
  width: 100%; height: 100%; object-fit: contain;
  border-radius: 13px; padding: 11px;
  background: rgba(255, 255, 255, .94);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04);
}
.tile-name {
  width: 56px; font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; text-align: center; text-shadow: var(--text-shadow);
}

/* ===== 文件夹卡片 2×2 预览 ===== */
.folder-card {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  padding: 16px; border-radius: 18px; border: 1px solid var(--card-border);
  background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow); color: var(--fg); min-width: 190px;
}
.folder-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.folder-title svg { width: 15px; height: 15px; opacity: .65; }
.folder-previews { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.fp {
  display: flex; align-items: center; justify-content: center;
  aspect-ratio: 1; border-radius: 13px; font-size: 20px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 12px rgba(0,0,0,.16); overflow: hidden;
}
.fp img {
  width: 100%; height: 100%; object-fit: contain; padding: 8px;
  background: rgba(255, 255, 255, .93);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .05);
}
html[data-theme="dark"] .fp img { background: rgba(255, 255, 255, .88); }

/* =======================================================
   A｜现状：纯白底板（对照组）
   ======================================================= */
.v-a .tile-avatar { background: transparent; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.v-a .tile-img { padding: 11px; background: rgba(255,255,255,.94); border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
.v-a .fp { background: transparent; }
.v-a .fp img { padding: 8px; background: rgba(255,255,255,.93); border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }

/* =======================================================
   B｜磨砂玻璃卡
   ======================================================= */
.v-b .tile-avatar {
  background: rgba(255,255,255,.30);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 8px 22px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.65);
}
.v-b .tile-img { padding: 9px; background: transparent; border-radius: 10px; box-shadow: none; }
.v-b .fp {
  background: rgba(255,255,255,.30); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.55);
}
.v-b .fp img { padding: 6px; background: transparent; border-radius: 10px; box-shadow: none; }

/* =======================================================
   C｜裸图标 · 柔和投影
   ======================================================= */
.v-c .tile-avatar { background: transparent; box-shadow: none; }
.v-c .tile-img {
  padding: 5px; background: transparent; border-radius: 12px; box-shadow: none;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)) drop-shadow(0 6px 12px rgba(0,0,0,.26));
}
.v-c .fp { background: transparent; box-shadow: none; }
.v-c .fp img {
  padding: 4px; background: transparent; border-radius: 10px; box-shadow: none;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.16)) drop-shadow(0 4px 8px rgba(0,0,0,.26));
}

/* =======================================================
   D｜描边线框
   ======================================================= */
.v-d .tile-avatar {
  background: rgba(255,255,255,.10);
  border: 1.5px solid rgba(255,255,255,.65);
  box-shadow: 0 6px 18px rgba(0,0,0,.14);
}
.v-d .tile-img { padding: 10px; background: transparent; border-radius: 10px; box-shadow: none; }
.v-d .fp { background: rgba(255,255,255,.10); border: 1.5px solid rgba(255,255,255,.65); }
.v-d .fp img { padding: 7px; background: transparent; border-radius: 10px; box-shadow: none; }

/* =======================================================
   E｜品牌光环
   ======================================================= */
.v-e .tile-avatar {
  background: transparent;
  box-shadow: 0 0 0 2.5px var(--brand),
              0 10px 26px rgba(0,0,0,.20),
              0 0 22px color-mix(in srgb, var(--brand) 45%, transparent);
}
.v-e .tile-img { padding: 10px; background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.v-e .fp {
  background: transparent;
  box-shadow: 0 0 0 2.5px var(--brand), 0 6px 18px rgba(0,0,0,.18);
}
.v-e .fp img { padding: 7px; background: #fff; border-radius: 10px; box-shadow: none; }
html[data-theme="dark"] .v-e .tile-img,
html[data-theme="dark"] .v-e .fp img { background: rgba(255,255,255,.92); }

/* =======================================================
   F｜浮雕白卡
   ======================================================= */
.v-f .tile-avatar {
  background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,255,255,.52));
  box-shadow: 7px 7px 18px rgba(0,0,0,.18), -5px -5px 14px rgba(255,255,255,.55),
              inset 0 0 0 1px rgba(255,255,255,.6);
}
.v-f .tile-img { padding: 9px; background: transparent; border-radius: 10px; box-shadow: none; }
.v-f .fp {
  background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,255,255,.52));
  box-shadow: 5px 5px 12px rgba(0,0,0,.16), -3px -3px 10px rgba(255,255,255,.5);
}
.v-f .fp img { padding: 6px; background: transparent; border-radius: 10px; box-shadow: none; }

/* =======================================================
   G｜品牌柔光（无底板）
   ======================================================= */
.v-g .tile-avatar { background: transparent; box-shadow: none; }
.v-g .tile-img {
  padding: 6px; background: transparent; border-radius: 12px; box-shadow: none;
  filter: drop-shadow(0 0 12px color-mix(in srgb, var(--brand) 60%, transparent))
          drop-shadow(0 6px 10px rgba(0,0,0,.24));
}
.v-g .fp { background: transparent; box-shadow: none; }
.v-g .fp img {
  padding: 5px; background: transparent; border-radius: 10px; box-shadow: none;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--brand) 60%, transparent))
          drop-shadow(0 4px 8px rgba(0,0,0,.24));
}

/* ===== 深色主题微调 ===== */
html[data-theme="dark"] .v-b .tile-avatar,
html[data-theme="dark"] .v-b .fp { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.16); }
html[data-theme="dark"] .v-d .tile-avatar,
html[data-theme="dark"] .v-d .fp { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.22); }
html[data-theme="dark"] .v-a .tile-img { background: rgba(255,255,255,.90); }
html[data-theme="dark"] .v-f .tile-avatar,
html[data-theme="dark"] .v-f .fp { background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); box-shadow: 7px 7px 18px rgba(0,0,0,.42), -4px -4px 12px rgba(255,255,255,.06); }
</style>
</head>
<body>
<div class="page-head">
  <h1>MyTab · 磁贴图标样式方案</h1>
  <p>目标：去掉「纯白色底板」的廉价感，让站点图标和整体毛玻璃 / 渐变背景语言统一。以下 7 个方案并排对比，字母为方案代号。</p>
  <button class="theme-toggle" id="themeBtn" type="button">切换深色 / 浅色</button>
</div>
<div id="root"></div>

<script>
var SITES = [
  { n: '哔哩哔哩', f: 'bilibili', c: '#FB7299' },
  { n: '知乎',     f: 'zhihu',    c: '#0084FF' },
  { n: 'GitHub',   f: 'github',   c: '#24292F' },
  { n: '豆瓣',     f: 'douban',   c: '#33B045' },
  { n: '微博',     f: 'weibo',    c: '#E6162D' },
  { n: '掘金',     f: 'juejin',   c: '#1E80FF' }
];

var VARIANTS = [
  { k: 'A', t: '现状 · 纯白底板', d: '对照组：图标 + 11px 白色圆角底板 + 内描边。当前观感偏「贴纸」，白底和彩色背景对撞。' },
  { k: 'B', t: '磨砂玻璃卡',     d: '去掉白底板，改用半透明毛玻璃圆角卡承载图标，与搜索框 / 分组卡片同一套材质语言。' },
  { k: 'C', t: '裸图标 · 柔和投影', d: '彻底不要底板，图标直接站在背景上，用 drop-shadow 制造层次，最干净、最轻盈。' },
  { k: 'D', t: '描边线框',       d: '只有一圈半透明细描边 + 极淡填充，弱化容器感，保留秩序感。' },
  { k: 'E', t: '品牌光环',       d: '白底板保留但缩小，外圈用站点主色描边并溢出柔光，图标有「品牌感」且仍然清晰。' },
  { k: 'F', t: '浮雕白卡',       d: '白色渐变卡 + 双向光影，立体浮起，质感更「实」，在浅色背景上尤其干净。' },
  { k: 'G', t: '品牌柔光（无底板）', d: 'C 的进阶：底板去掉，投影换成站点主色光晕，图标像自己在发光。' }
];

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function tileHTML(s){
  return '<a class="tile" href="#">' +
    '<span class="tile-avatar" style="--brand:' + s.c + '">' +
      '<img class="tile-img" src="assets/' + s.f + '.ico" alt="">' +
    '</span>' +
    '<span class="tile-name">' + esc(s.n) + '</span>' +
  '</a>';
}

function folderHTML(){
  var ic = '<svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M640 192H416a32 32 0 0 0-32 32v64H192a32 32 0 0 0-32 32v448a32 32 0 0 0 32 32h640a32 32 0 0 0 32-32V320a32 32 0 0 0-32-32h-64v-64a32 32 0 0 0-32-32zM224 672V384h192v96h192v-96h192v288H224z"/></svg>';
  var cells = SITES.slice(0,4).map(function(s){
    return '<span class="fp has-icon" style="--brand:' + s.c + '"><img src="assets/' + s.f + '.ico" alt=""></span>';
  }).join('');
  return '<div class="folder-card">' +
    '<div class="folder-title">' + ic + '<span>常用</span></div>' +
    '<div class="folder-previews">' + cells + '</div>' +
  '</div>';
}

var html = '';
VARIANTS.forEach(function(v){
  html += '<section class="panel v-' + v.k.toLowerCase() + '">' +
    '<div class="panel-head">' +
      '<span class="badge">' + v.k + '</span>' +
      '<div><h2>' + v.t + '</h2><p class="desc">' + v.d + '</p></div>' +
    '</div>' +
    '<div class="panel-body">' +
      '<div class="tiles">' + SITES.map(tileHTML).join('') + '</div>' +
      folderHTML() +
    '</div>' +
  '</section>';
});
document.getElementById('root').innerHTML = html;

if (location.search.indexOf('dark') >= 0) document.documentElement.setAttribute('data-theme','dark');
document.getElementById('themeBtn').addEventListener('click', function(){
  var el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
